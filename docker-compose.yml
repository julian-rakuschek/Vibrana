services:
  mongodb_container:
    container_name: vibrana_mongodb
    image: mongo:latest
    expose:
      - 27017
    volumes:
      - mongodb_volume:/data/db
    networks:
      - vibrana

  redis_container:
    container_name: vibrana_redis
    image: redis:latest
    restart: always
    expose:
      - 6379
    volumes:
      - cache:/data
    networks:
      - vibrana

  backend:
    container_name: vibrana_app
    build:
      dockerfile: Dockerfile_backend
    depends_on:
      - redis_container
      - mongodb_container
    expose:
      - 5000
    volumes:
      - ./data:/app/data
    environment:
      - DOCKER=True
    networks:
      - vibrana


volumes:
  mongodb_volume:
    driver: local
  cache:
    driver: local

networks:
  vibrana:
